const total = fees.reduce((sum,fee) => sum + fee.cents,0);
const money = cents => (cents/100).toFixed(2);
let paid = location.hash === '#paid';
const paymentBrand = () => '<svg class="pay-logo" viewBox="0 0 8 8" shape-rendering="crispEdges" aria-hidden="true"><path fill="#0cba60" d="M1 0h6v1h1v6H7v1H1V7H0V1h1z"/><path fill="#e8f8ed" d="M2 2h4v1h1v2H6v1H4v1H3V6H1V3h1z"/><path fill="#9cdab7" d="M2 2h1v1H2zm3 0h1v1H5zM1 4h1v1H1zm4 1h1v1H5z"/><path fill="#46c984" d="M2 3h1v1H2zm3 0h1v1H5zM3 5h1v1H3z"/></svg><span class="privacy-mask">微信支付</span>';
let paymentPhase='closed', paymentTimer, receiptTimer, paymentFocus;
function closePayment(){
  clearTimeout(paymentTimer);clearTimeout(receiptTimer);paymentPhase='closed';
  $('#payment-layer').hidden=true;$('#payment-progress').hidden=true;
  for(const child of $('.phone').children)if(child.id!=='payment-layer')child.inert=false;
  if(paymentFocus?.isConnected)paymentFocus.focus();
}
function openPayment(){
  if(paid||paymentPhase!=='closed')return;
  paymentFocus=document.activeElement;paymentPhase='ready';
  $('#payment-layer').hidden=false;$('#payment-progress').hidden=true;
  $('#payment-progress').classList.remove('is-done');$('#payment-status').textContent='正在支付';$('#payment-caption').textContent='请稍候';
  $('#cancel-pay').disabled=false;$('#confirm-pay').disabled=false;
  for(const child of $('.phone').children)if(child.id!=='payment-layer')child.inert=true;
  $('#confirm-pay').focus();window.PropertyPrivacy?.refresh();
}
function cancelPayment(){if(paymentPhase==='ready')closePayment();}
function confirmPayment(){
  if(paymentPhase!=='ready')return;
  paymentPhase='processing';$('#cancel-pay').disabled=true;$('#confirm-pay').disabled=true;$('#payment-progress').hidden=false;$('#payment-layer').focus();
  paymentTimer=setTimeout(()=>{
    paymentPhase='complete';$('#payment-progress').classList.add('is-done');$('#payment-status').textContent='支付完成';$('#payment-caption').textContent='正在加载支付结果';
    receiptTimer=setTimeout(()=>{closePayment();paid=true;location.hash='wechat-paid';},600);
  },1200);
}
$('.payment-amount').innerHTML='<small>¥</small>'+money(total);
$('#payment-title').innerHTML=paymentBrand();$('#payment-done').innerHTML=icon('check');

16.1" font-family="Arial,sans-serif" font-size="12.8" textLength="18.5" lengthAdjust="spacingAndGlyphs">81</text></g></svg></div><div class="wechat-result-heading"><svg class="wechat-result-mark" viewBox="0 0 32 32" aria-hidden="true"><path fill="#07b75b" d="M16 2C7.7 2 1 7.5 1 14.3c0 3.4 1.7 6.5 4.5 8.8L4 29l6.1-3.3c1.8.6 3.8.9 5.9.9 8.3 0 15-5.5 15-12.3S24.3 2 16 2Z"/><path fill="none" stroke="#fff" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round" d="m7.5 13.5 5.2 4.2L26 9.5"/></svg><h1>支付成功</h1></div><div class="wechat-result-merchant">青禾物业</div><div class="wechat-result-amount"><small>¥</small>'+money(total)+'</div><button class="wechat-result-done" data-action="finish-wechat">返回商家</button></section>';}
function history(){return '<div class="bill-title"><h1>缴费记录</h1><p>青禾雅苑 · A1-0201</p></div><div class="content">'+(paid?'<a class="history-card" href="#paid"><div><strong>2026 年 11 月</strong><span class="tag green">已缴清</span></div><p>物业费 / 水费 / 电费</p><div style="margin-top:12px"><span class="sum">¥'+money(total)+'</span><span class="tiny">查看回执 ›</span></div></a>':'<div class="empty">暂无缴费记录<br><br><a class="secondary" href="#bill">去查看本期账单</a></div>')+'<p class="bill-disclaimer">已为您展示全部缴费记录。</p></div>';}
function profile(){return '<div class="profile"><div class="avatar">周</div><h1>周**</h1><p>青禾生活 · 已认证业主</p><section class="panel"><h2>我的房屋</h2><div class="detail-row"><span>小区</span><b>青禾雅苑</b></div><div class="detail-row"><span>房号</span><b>A1-0201</b></div><div class="detail-row"><span>建筑面积</span><b>98.00 ㎡</b></div></section><a class="history-card" href="#history"><div><strong>我的缴费记录</strong><span>›</span></div></a><button class="secondary" style="width:100%" data-action="reset">重新开始</button><p class="bill-disclaimer" style="margin-top:20px">您的房屋信息已绑定。</p></div>';}
function render(){if(paymentPhase!=='closed')closePayment();const route=location.hash.slice(1)||'home';const current=['home','bill','paid','wechat-paid','history','profile'].includes(route)?route:'home';if(current==='paid'||current==='wechat-paid')paid=true;document.body.classList.toggle('wechat-fullscreen',current==='wechat-paid');$('#app-title').textContent={home:'青禾生活',bill:'生活缴费',paid:'缴费结果','wechat-paid':'支付成功',history:'缴费记录',profile:'我的青禾'}[current];$('.back').hidden=current==='home';$('#screen').innerHTML={home,bill,paid:receipt,'wechat-paid':wechatPaid,history,profile}[current]();$('#screen').scrollTop=0;$('#bottom').innerHTML=current==='bill'?'<div class="pay-footer"><div><small>'+(paid?'已缴合计':'合计')+'</small><div class="amount"><small>¥</small>'+money(total)+'</div></div>'+(paid?'<a class="primary" href="#paid">查看回执</a>':'<button class="primary payment-button" data-action="pay" aria-label="微信支付">'+paymentBrand()+'</button>')+'</div>':(current==='paid'||current==='wechat-paid')?'':nav(current==='profile'?'profile':current==='history'?'bill':'home');}
function reset(){closePayment();paid=false;location.hash='home';render();}
$('.back').addEventListener('click',()=>{location.hash='home';});
$('#desktop-reset').addEventListener('click',reset);
document.addEventListener('click',event=>{const button=event.target.closest('[data-action]');if(!button)return;const action=button.dataset.action;if(action==='pay')openPayment();if(action==='finish-wechat')location.hash='#bill';if(action==='reset')reset();if(action==='service')$('#info-dialog').showModal();});
$('#cancel-pay').addEventListener('click',cancelPayment);
$('#confirm-pay').addEventListener('click',confirmPayment);
$('#close-info').addEventListener('click',()=>$('#info-dialog').close());
document.addEventListener('keydown',event=>{
  if(paymentPhase==='closed')return;
  if(event.key==='Escape'){event.preventDefault();cancelPayment();}
  if(event.key==='Tab'){
    event.preventDefault();
    if(paymentPhase==='ready')(document.activeElement===$('#confirm-pay')?$('#cancel-pay'):$('#confirm-pay')).focus();
    else $('#payment-layer').focus();
  }
});

window.addEventListener('hashchange',render);
render();
</script>
